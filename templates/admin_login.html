<!DOCTYPE html>
<html>
<head>

    <title>UniAssist AI - Admin Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #35106b, #7c2ae8);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            color: #5520a5;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #7c2ae8, #a64cff);
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            margin-top: 15px;
            background: #ffe5e5;
            color: #c00000;
            padding: 12px;
            border-radius: 8px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6525bd;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>👑 Admin Login</h1>

    <div class="subtitle">
        UniAssist AI Administration
    </div>

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter admin username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter admin password"
            required
        >

        <button type="submit">
            🔐 Login as Admin
        </button>

    </form>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <a href="/" class="back">
        ← Back to UniAssist AI
    </a>

</div>

</body>
</html>
