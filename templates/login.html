<!DOCTYPE html>
<html>
<head>
    <title>UniAssist AI - Login</title>
</head>

<body>

<h1>🤖 UniAssist AI</h1>

<h2>Login</h2>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST">

    <input
        type="email"
        name="email"
        placeholder="Email"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

<br>

<p>
Don't have an account?
<a href="/signup">Create Account</a>
</p>

</body>
</html>
