<!DOCTYPE html>
<html>
<head>
    <title>UniAssist AI - Signup</title>
</head>

<body>

<h1>🤖 UniAssist AI</h1>

<h2>Create Student Account</h2>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<form method="POST">

    <input
        type="text"
        name="name"
        placeholder="Full Name"
        required
    >

    <br><br>

    <input
        type="email"
        name="email"
        placeholder="Email"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required
    >

    <br><br>

    <input
        type="password"
        name="confirm_password"
        placeholder="Confirm Password"
        required
    >

    <br><br>

    <button type="submit">
        Create Account
    </button>

</form>

<br>

<a href="/login">
Already have an account? Login
</a>

</body>
</html>
